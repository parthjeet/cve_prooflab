# Policy for the AI security gate (ai-security-gate/). The gate reads this file
# from the base commit of a change, so a change cannot alter the policy that
# judges it.

fail_on = "high"
min_confidence = "medium"
triage_min_severity = "medium"
# A review resends the diff with each request. The default of 400,000 input
# tokens is too low for the largest changes in this repository.
max_input_tokens = 800000

[[suppress]]
path = "ai-security-gate/selftest/fixtures/**"
reason = "Test inputs for the gate's self-test. No build or runtime path loads these files."
expires = 2027-05-18

# Semgrep pins mcp==1.29.0 and opentelemetry-api~=1.37.0 in every release up
# to 1.186.0, so these advisories cannot be fixed by an upgrade. Review them
# when a Semgrep release raises those pins.

[[suppress]]
path = "requirements-scan.txt"
id = "CVE-2026-116684"
reason = "Dependency of the Semgrep CI scanner, pinned upstream by Semgrep. Installed only in the scan job's tool environment; not part of the application."
expires = 2026-12-19

