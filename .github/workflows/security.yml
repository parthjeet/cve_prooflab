name: security

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit SHA
        required: true
      head:
        description: Head commit SHA
        required: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      showcase: ${{ steps.find.outputs.showcase }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changes to the showcase model
        id: find
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          showcase=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "$PR_BASE...$PR_HEAD" -- scripts/showcase/ci-model.txt)"
            if [ -n "$changed" ]; then
              showcase=true
            fi
          fi
          echo "showcase=$showcase"
          echo "showcase=$showcase" >> "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_VERSION: "0.13.9"
      # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz 0.13.9, checked against the release's checksums file and with `gh release verify-asset` on 2026-11-18.
      UV_SHA256: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
      # uv must use the runner's Python 3.12 and must not download one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          mkdir -p "$RUNNER_TEMP/uv"
          cd "$RUNNER_TEMP/uv"
          curl -sSfL -o uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  uv.tar.gz" | sha256sum -c -
          tar -xzf uv.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Unit tests
        run: uv run --python 3.12 --no-project --with-requirements requirements-dev.txt --with-requirements ai-security-gate/requirements.txt python -m pytest ai-security-gate/tests -q -p no:cacheprovider

  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIVY_VERSION: "0.76.2"
      # sha256 of trivy_0.76.2_Linux-64bit.tar.gz, checked against the release's
      # checksums file and with `gh release verify-asset` on 2026-11-18.
      TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
      UV_VERSION: "0.13.9"
      # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz 0.13.9, checked the same way.
      UV_SHA256: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
      # uv must use the runner's Python 3.12 and must not download one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          mkdir -p "$RUNNER_TEMP/uv"
          cd "$RUNNER_TEMP/uv"
          curl -sSfL -o uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  uv.tar.gz" | sha256sum -c -
          tar -xzf uv.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Install Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          cd "$RUNNER_TEMP/trivy"
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          install -m 0755 trivy "$HOME/.local/bin/trivy"
          "$HOME/.local/bin/trivy" --version

      - name: Show runner tools
        run: |
          jq --version
          docker version --format 'client {{.Client.Version}}, server {{.Server.Version}}'
          uv python find 3.12

      - name: Build both images
        run: |
          docker build --build-arg REQUIREMENTS=requirements-vulnerable.txt -t cve_prooflab:vulnerable app/
          docker build --build-arg REQUIREMENTS=requirements-patched.txt -t cve_prooflab:patched app/

      - name: Scan both images
        id: scan
        run: scripts/scan.sh

      - name: Scan gate
        run: uv run --python 3.12 --no-project scripts/check_scan.py

      # pytest prints a PytestWarning that record_property is incompatible with
      # junit_family xunit2. It still writes the properties the gate reads.
      # Leave it as is (docs decision 2026-11-18, phase 4 review).
      - name: Validation gate
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: uv run --python 3.12 --no-project --with-requirements requirements-dev.txt scripts/validate.py

      - name: Generate report
        if: ${{ !cancelled() }}
        run: uv run --python 3.12 --no-project scripts/generate_report.py

      - name: Check report and repository
        if: ${{ !cancelled() }}
        run: |
          grep -q '^### Hypotheses$' reports/report.md
          test -z "$(git ls-files docs)"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cve-prooflab-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIVY_VERSION: "0.76.2"
      # sha256 of trivy_0.76.2_Linux-64bit.tar.gz, checked against the release's
      # checksums file and with `gh release verify-asset` on 2026-11-18.
      TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
      UV_VERSION: "0.13.9"
      UV_SHA256: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        run: |
          mkdir -p "$RUNNER_TEMP/uv"
          cd "$RUNNER_TEMP/uv"
          curl -sSfL -o uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  uv.tar.gz" | sha256sum -c -
          tar -xzf uv.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Install Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          cd "$RUNNER_TEMP/trivy"
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          install -m 0755 trivy "$HOME/.local/bin/trivy"
          "$HOME/.local/bin/trivy" --version

      # The environment lives outside the checkout, so the scan does not read it.
      - name: Install Semgrep
        run: |
          uv venv "$RUNNER_TEMP/scan-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/scan-venv/bin/python" --require-hashes -r requirements-scan.txt
          echo "$RUNNER_TEMP/scan-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch Semgrep rules
        env:
          RULES_SHA: "16b9e6d45f10649f6a531ec4838ed9924372c3bc"
        run: |
          rules="$RUNNER_TEMP/semgrep-rules"
          mkdir -p "$rules"
          cd "$rules"
          git init -q
          git fetch -q --depth 1 https://github.com/semgrep/semgrep-rules "$RULES_SHA"
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$RULES_SHA" ]; then
            echo "ERROR: the rules checkout is not at the pinned commit."
            exit 1
          fi

      - name: Run scanners
        run: scripts/ci/security_scan.sh "$RUNNER_TEMP/scanner-reports" "$RUNNER_TEMP/semgrep-rules"

      - name: Pick base and head
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASE: ${{ inputs.base }}
          DISPATCH_HEAD: ${{ inputs.head }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            base="$DISPATCH_BASE"
            head="$DISPATCH_HEAD"
          else
            base="$PR_BASE"
            head="$PR_HEAD"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Baseline
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          reports="$RUNNER_TEMP/scanner-reports"
          rc=0
          python3 ai-security-gate/baseline.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "$BASE" \
            --head "$HEAD" \
            --scanner-report "$reports/trivy-deps.json" \
            --sarif "$reports/trivy-config.sarif" \
            --sarif "$reports/semgrep.sarif" \
            --summary-path "$reports/security-baseline-summary.json" || rc=$?
          echo "baseline exit code: $rc"
          # Exit 1 is BLOCK. The report job turns it into the result of the run.
          if [ "$rc" -gt 1 ]; then
            exit "$rc"
          fi

      - name: Upload scanner reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-reports
          path: ${{ runner.temp }}/scanner-reports
          if-no-files-found: error
          retention-days: 7

  review:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cvp
    if: >-
      vars.AI_GATE_CI == 'true' &&
      github.triggering_actor == 'parthjeet' &&
      ( github.event_name == 'workflow_dispatch' ||
        ( github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'parthjeet' &&
          github.event.pull_request.head.repo.full_name == github.repository ) )
    steps:
      - name: Check key dates
        env:
          CVP_KEY_DATE: ${{ vars.CVP_KEY_DATE }}
        run: |
          today="$(date -u +%F)"
          if [[ ! "$today" < "2026-12-14" ]]; then
            echo "ERROR: static keys end on 2026-12-14. No paid run."
            exit 1
          fi
          if [[ ! "$CVP_KEY_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "$CVP_KEY_DATE" +%F >/dev/null 2>&1; then
            echo "ERROR: CVP_KEY_DATE is not set."
            exit 1
          fi
          oldest="$(date -u -d "$today - 6 days" +%F)"
          if [[ "$CVP_KEY_DATE" < "$oldest" || "$CVP_KEY_DATE" > "$today" ]]; then
            echo "ERROR: the key is older than 7 days. Replace it and update CVP_KEY_DATE."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download scanner reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanner-reports
          path: ${{ runner.temp }}/scanner-reports

      - name: Pick base and head
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASE: ${{ inputs.base }}
          DISPATCH_HEAD: ${{ inputs.head }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            base="$DISPATCH_BASE"
            head="$DISPATCH_HEAD"
          else
            base="$PR_BASE"
            head="$PR_HEAD"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: AI security gate
        uses: ./ai-security-gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          scanner-report: ${{ runner.temp }}/scanner-reports/trivy-deps.json
          sarif-reports: |
            ${{ runner.temp }}/scanner-reports/trivy-config.sarif
            ${{ runner.temp }}/scanner-reports/semgrep.sarif
          public-details: "true"

      - name: Upload summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-security-gate-summary
          path: ai-security-gate-summary.json
          retention-days: 90

  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cvp
    if: >-
      vars.AI_GATE_CI == 'true' &&
      github.triggering_actor == 'parthjeet' &&
      ( github.event_name == 'workflow_dispatch' ||
        ( github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'parthjeet' &&
          github.event.pull_request.head.repo.full_name == github.repository ) )
    env:
      UV_VERSION: "0.13.9"
      UV_SHA256: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check key dates
        env:
          CVP_KEY_DATE: ${{ vars.CVP_KEY_DATE }}
        run: |
          today="$(date -u +%F)"
          if [[ ! "$today" < "2026-12-14" ]]; then
            echo "ERROR: static keys end on 2026-12-14. No paid run."
            exit 1
          fi
          if [[ ! "$CVP_KEY_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "$CVP_KEY_DATE" +%F >/dev/null 2>&1; then
            echo "ERROR: CVP_KEY_DATE is not set."
            exit 1
          fi
          oldest="$(date -u -d "$today - 6 days" +%F)"
          if [[ "$CVP_KEY_DATE" < "$oldest" || "$CVP_KEY_DATE" > "$today" ]]; then
            echo "ERROR: the key is older than 7 days. Replace it and update CVP_KEY_DATE."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changes under ai-security-gate
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASE: ${{ inputs.base }}
          DISPATCH_HEAD: ${{ inputs.head }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            base="$DISPATCH_BASE"
            head="$DISPATCH_HEAD"
          else
            base="$PR_BASE"
            head="$PR_HEAD"
          fi
          changed="$(git diff --name-only "$base...$head" -- ai-security-gate/)"
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        run: |
          mkdir -p "$RUNNER_TEMP/uv"
          cd "$RUNNER_TEMP/uv"
          curl -sSfL -o uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  uv.tar.gz" | sha256sum -c -
          tar -xzf uv.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Self-test
        if: ${{ steps.changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/selftest-venv"
          uv pip install --python "$RUNNER_TEMP/selftest-venv/bin/python" --require-hashes -r ai-security-gate/requirements.txt
          "$RUNNER_TEMP/selftest-venv/bin/python" ai-security-gate/selftest.py --evidence-dir "$RUNNER_TEMP/selftest-evidence"

      - name: Upload self-test summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-summaries
          path: ${{ runner.temp }}/selftest-evidence/*-summary.json
          if-no-files-found: ignore
          retention-days: 90

  report:
    needs: [scan, review]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download baseline summary
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanner-reports
          path: ${{ runner.temp }}/scanner-reports

      - name: Download summary
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-security-gate-summary
          path: ${{ runner.temp }}/summary

      - name: Render report
        id: render
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          python3 ai-security-gate/report.py \
            --summary "$RUNNER_TEMP/summary/ai-security-gate-summary.json" \
            --baseline "$RUNNER_TEMP/scanner-reports/security-baseline-summary.json" \
            --review-result "$REVIEW_RESULT" \
            --verdict-out "$RUNNER_TEMP/verdict.txt" \
            --repo "$REPO" \
            --run-url "$RUN_URL" > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Post comment
        if: ${{ steps.render.outputs.ready == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/sticky_comment.sh "$RUNNER_TEMP/report.md"

      - name: Fail unless the verdict is PASS
        if: ${{ !cancelled() }}
        run: |
          verdict="$(cat "$RUNNER_TEMP/verdict.txt" 2>/dev/null || true)"
          echo "Final verdict: ${verdict:-none}"
          test "$verdict" = "PASS"

  showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cvp
    needs: changes
    if: >-
      needs.changes.outputs.showcase == 'true' &&
      vars.AI_GATE_CI == 'true' &&
      github.triggering_actor == 'parthjeet' &&
      ( github.event_name == 'workflow_dispatch' ||
        ( github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'parthjeet' &&
          github.event.pull_request.head.repo.full_name == github.repository ) )
    env:
      UV_VERSION: "0.13.9"
      UV_SHA256: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check key dates
        env:
          CVP_KEY_DATE: ${{ vars.CVP_KEY_DATE }}
        run: |
          today="$(date -u +%F)"
          if [[ ! "$today" < "2026-12-14" ]]; then
            echo "ERROR: static keys end on 2026-12-14. No paid run."
            exit 1
          fi
          if [[ ! "$CVP_KEY_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "$CVP_KEY_DATE" +%F >/dev/null 2>&1; then
            echo "ERROR: CVP_KEY_DATE is not set."
            exit 1
          fi
          oldest="$(date -u -d "$today - 6 days" +%F)"
          if [[ "$CVP_KEY_DATE" < "$oldest" || "$CVP_KEY_DATE" > "$today" ]]; then
            echo "ERROR: the key is older than 7 days. Replace it and update CVP_KEY_DATE."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick model
        id: pick
        run: |
          value="$(tr -d '[:space:]' < scripts/showcase/ci-model.txt)"
          if [ "$value" = "claude-fable-5-2" ]; then
            echo "model=claude-fable-5-2" >> "$GITHUB_OUTPUT"
          elif [ "$value" = "claude-mythos-5-2" ]; then
            echo "model=claude-mythos-5-2" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: ci-model.txt must name claude-fable-5-2 or claude-mythos-5-2."
            exit 1
          fi

      - name: Install uv
        run: |
          mkdir -p "$RUNNER_TEMP/uv"
          cd "$RUNNER_TEMP/uv"
          curl -sSfL -o uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  uv.tar.gz" | sha256sum -c -
          tar -xzf uv.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version

      - name: Create venv and install pinned packages
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/showcase-venv"
          uv pip install --python "$RUNNER_TEMP/showcase-venv/bin/python" --require-hashes -r ai-security-gate/requirements.txt

      - name: Run model comparison
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CVP_ACCESS_NOTE: ${{ secrets.CVP_ACCESS_NOTE }}
          MODEL: ${{ steps.pick.outputs.model }}
        run: |
          if [ -z "$CVP_ACCESS_NOTE" ]; then
            echo "ERROR: CVP_ACCESS_NOTE is not set."
            exit 1
          fi
          VENV="$RUNNER_TEMP/showcase-venv"
          rc=0
          "$VENV/bin/python" scripts/compare_models.py --run --models "$MODEL" --tasks R3,R4 --repeats 3 --access-note "$CVP_ACCESS_NOTE" || rc=$?
          echo "compare_models.py exit code: $rc"

      - name: Verdict
        env:
          MODEL: ${{ steps.pick.outputs.model }}
        run: python3 scripts/showcase/ci_verdict.py reports/showcase/summary.json "$MODEL"

      - name: Upload summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-showcase-summary
          path: reports/showcase/summary.json
          if-no-files-found: ignore
          retention-days: 90

  showcase-report:
    needs: showcase
    if: ${{ !cancelled() && needs.showcase.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download summary
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-showcase-summary
          path: ${{ runner.temp }}/summary

      - name: Render report
        id: render
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary="$RUNNER_TEMP/summary/summary.json"
          if [ -f "$summary" ]; then
            python3 scripts/showcase/ci_report.py "$summary" --run-url "$RUN_URL" > "$RUNNER_TEMP/report.md"
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No showcase summary for this run." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post comment
        if: ${{ steps.render.outputs.ready == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/sticky_comment.sh "$RUNNER_TEMP/report.md"
